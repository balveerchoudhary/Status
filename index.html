<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4472c4">
<title>Daily Status Reporter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="timesheet.js"></script>
<style>
  :root { --bg:#f3f5fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --primary:#4472c4; --primary-d:#2f56a0;
          --ok:#16a34a; --danger:#dc2626; --green:#e3f8ec; --yellow:#fff9c4; --soft:#eef2fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#181f2e; --text:#e5e7eb; --muted:#9ca3af; --line:#2a3347; --green:#16352a; --yellow:#3b3715; --soft:#1f2940; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif; padding-bottom:calc(150px + env(safe-area-inset-bottom)); }
  header { background:linear-gradient(135deg,#4472c4,#2f56a0); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:18px; } header small { opacity:.9; }
  main { max-width:760px; margin:0 auto; padding:12px; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input, textarea, select { width:100%; min-height:44px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:inherit; }
  textarea { resize:none; overflow:hidden; display:block; }
  select option { color:#000; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--primary); border-color:transparent; }
  button { cursor:pointer; border:0; border-radius:10px; min-height:44px; padding:0 14px; font:inherit; font-weight:600; background:var(--primary); color:#fff; }
  button:active { filter:brightness(.9); }
  button:disabled { opacity:.6; }
  button.ghost { background:var(--soft); color:var(--primary); }
  small.m { color:var(--muted); }

  /* add form */
  #form { display:grid; gap:8px; }
  .chips { display:flex; gap:6px; align-items:center; }
  .chip { min-height:38px; min-width:46px; padding:0 8px; background:var(--soft); color:var(--text); font-weight:600; }
  .chip.on { background:var(--primary); color:#fff; }
  .chips input { width:76px; min-height:38px; text-align:center; margin-left:auto; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #hint { font-size:12px; color:var(--muted); }

  /* month bar */
  .bar { display:flex; gap:10px; align-items:center; }
  .bar input { flex:1; } #mtotal { font-weight:700; white-space:nowrap; }

  /* days */
  .day { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .day.today { border-color:var(--primary); box-shadow:0 0 0 2px rgba(68,114,196,.2); }
  .day.off, .day.wk { background:var(--green); } .day.leave { background:var(--yellow); }
  .dayhead { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; padding:10px 12px; background:var(--soft); cursor:pointer; user-select:none; }
  .dayhead b { font-size:15px; } .caret { color:var(--muted); width:14px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; background:var(--card); color:var(--muted); border:1px solid var(--line); }
  .badge.now { background:var(--primary); color:#fff; border-color:transparent; }
  .hrs { margin-left:auto; font-weight:700; }
  .dayhead select { width:auto; min-height:34px; padding:2px 6px; font-size:13px; }
  .empty { padding:16px; color:var(--muted); text-align:center; }

  .trow { display:grid; grid-template-columns:40px 1fr; gap:4px 4px; padding:10px 10px 10px 2px; border-top:1px solid var(--line); background:var(--card); }
  .trow.def { border-left:4px solid #9ca3af; }
  .trow.moving { background:var(--soft); box-shadow:0 6px 18px rgba(0,0,0,.3); position:relative; z-index:2; }
  .grip { grid-row:1 / span 2; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--muted); cursor:grab; touch-action:none; user-select:none; }
  .r2 { display:flex; gap:6px; align-items:center; }
  .r2 [data-f=sub] { flex:1; min-width:0; min-height:40px; } .r2 [data-f=hrs] { width:66px; min-height:40px; text-align:center; padding:9px 2px; }
  .r2 .ico { min-width:36px; min-height:40px; padding:0; background:transparent; color:var(--muted); font-size:16px; }
  .r2 .ico.del { color:var(--danger); }
  .tag { grid-column:2; font-size:11px; color:var(--muted); }

  /* defaults */
  .drow { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .drow .opts { grid-column:1 / -1; display:flex; gap:16px; flex-wrap:wrap; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:var(--text); margin:0; min-height:36px; }
  .chk input { width:22px; height:22px; min-height:0; accent-color:var(--primary); }
  details summary { cursor:pointer; font-weight:600; min-height:32px; display:flex; align-items:center; gap:6px; }
  details[open] summary { margin-bottom:8px; }

  .dock { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); z-index:5; max-width:760px; margin:0 auto; }
  .dock button { min-height:50px; } #send { flex:1; font-size:16px; } #dl { flex:0 0 auto; padding:0 18px; }
  #toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:#111827; color:#fff; padding:10px 14px; border-radius:12px; display:flex; gap:12px; align-items:center; opacity:0; pointer-events:none; transition:.2s; z-index:9; max-width:92vw; font-size:14px; }
  #toast.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #toast.ok { background:#166534; } #toast.err { background:#b91c1c; }
  #toast button { min-height:30px; padding:0 10px; background:rgba(255,255,255,.2); }
  .more { width:100%; }
</style>
</head>
<body>
<header>
  <h1>📋 Daily Status</h1>
  <small id="who"></small>
</header>

<main>
  <details class="card" id="setBox">
    <summary>⚙ Settings <small id="setNote" class="m" style="font-weight:400">— one-time setup</small></summary>
    <div class="grid2">
      <div><label for="name">Your name *</label><input id="name" placeholder="Balveer Choudhary"></div>
      <div><label for="empId">Employee Id *</label><input id="empId" placeholder="E25/2703"></div>
    </div>
    <label for="hook" style="margin-top:8px">Google Chat webhook URL *</label>
    <input id="hook" type="password">
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <button id="setSave" type="button">Save settings</button>
      <small class="m">Saved only in this browser, once.</small>
    </div>
  </details>

  <section class="card">
    <form id="form" autocomplete="off">
      <textarea id="desc" rows="2" placeholder="What did you work on?" enterkeyhint="done" required></textarea>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-h="0.5">0.5</button><button type="button" class="chip" data-h="1">1</button>
        <button type="button" class="chip" data-h="2">2</button><button type="button" class="chip" data-h="3">3</button>
        <input id="hrs" type="number" inputmode="decimal" step="0.25" min="0" value="1" aria-label="Hours">
      </div>
      <div class="grid2">
        <input id="sub" placeholder="Sub (e.g. AVID-50)" list="subList" aria-label="Task sub context">
        <input id="date" type="date" aria-label="Date">
      </div>
      <button type="submit">＋ Add task</button>
      <div id="hint"></div>
    </form>
    <datalist id="subList"></datalist>
  </section>

  <section class="bar"><input id="month" type="month" aria-label="Month"><span id="mtotal"></span></section>

  <div id="days" style="display:grid;gap:12px"></div>
  <button class="ghost more" id="older" hidden></button>

  <details class="card" id="defsBox">
    <summary>🔁 Daily defaults <small class="m" style="font-weight:400">— recurring tasks like meetings</small></summary>
    <div id="defs"></div>
    <div style="display:grid;gap:8px;margin-top:10px">
      <input id="dDesc" placeholder="e.g. Participated in Daily Scrum">
      <div class="grid2"><input id="dSub" placeholder="Sub (optional)"><input id="dHrs" type="number" inputmode="decimal" step="0.25" value="0.5" aria-label="Hours"></div>
      <label class="chk"><input type="checkbox" id="dChat"> Send to Chat</label>
      <button id="dAdd" type="button">＋ Add default</button>
    </div>
  </details>
</main>

<div id="toast"><span id="tmsg"></span><button id="tact" hidden>Undo</button></div>
<div class="dock">
  <button id="send">📤 Send today to Chat</button>
  <button id="dl" class="ghost">⬇ Excel</button>
</div>

<script>
const T = window.Timesheet;
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DEFAULT_HOOK = 'https://chat.googleapis.com/v1/spaces/AAQAl_LK3eY/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=nF6dHZ_NdJ0gRwpx7rRT97sHLbNnljKjs4WsHpB6brI';
const TODAY = T.isoLocal(new Date());

// ---------- state ----------
function blank() {
  return { name: '', empId: '', hook: DEFAULT_HOOK, tasks: [], days: {}, mat: [], lastSent: '',
           defaults: [{ id: uid(), desc: 'Participated in Daily Scrum', sub: '', hrs: 0.5, on: true, chat: false }] };
}
let S = Object.assign(blank(), store.get('v2', null));
const save = () => store.set('v2', S);
const isWorkday = d => ![0, 6].includes(T.dow(d)) && !S.days[d];
const defTask = (d, date) => ({ id: uid(), date, ctx: T.sprintFor(date), sub: d.sub || '', desc: d.desc, hrs: d.hrs, def: true, defId: d.id });
const sentFlag = t => t.def ? !!(S.defaults.find(d => d.id === t.defId) || {}).chat : true;

function ensureDefaults(date) {   // add the active defaults the first time a weekday is used
  if (S.mat.includes(date)) return;
  S.mat.push(date);
  if (!isWorkday(date)) return;
  S.defaults.filter(d => d.on !== false).forEach(d => S.tasks.push(defTask(d, date)));
}
ensureDefaults(TODAY); save();

// ---------- toast ----------
let tt;
function toast(msg, cls, undo) {
  $('tmsg').textContent = msg; $('toast').className = 'show ' + (cls || '');
  $('tact').hidden = !undo; $('tact').onclick = () => { undo && undo(); $('toast').className = ''; };
  clearTimeout(tt); tt = setTimeout(() => { $('toast').className = ''; }, undo ? 5000 : 2200);
}

// ---------- settings (one-time) ----------
$('name').value = S.name; $('empId').value = S.empId; $('hook').value = S.hook;
const who = () => { $('who').textContent = S.name; };
const setupOk = () => S.name && S.empId && /^https:\/\/chat\.googleapis\.com\//.test(S.hook);
$('name').oninput = e => { S.name = e.target.value.trim(); save(); who(); };
$('empId').oninput = e => { S.empId = e.target.value.trim(); save(); };
$('hook').oninput = e => { S.hook = e.target.value.trim(); save(); };
$('setBox').open = !setupOk(); who();
$('setSave').onclick = () => {
  const n = $('setNote');
  if (!setupOk()) { n.textContent = '— name, Employee Id and a valid webhook URL are required'; n.style.color = 'var(--danger)'; return; }
  n.textContent = '— saved ✓'; n.style.color = 'var(--ok)'; $('setBox').open = false;
};

// ---------- add task ----------
$('date').value = TODAY; $('month').value = TODAY.slice(0, 7);
function syncChips() { document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.h === parseFloat($('hrs').value))); }
$('chips').onclick = e => { const c = e.target.closest('.chip'); if (c) { $('hrs').value = c.dataset.h; syncChips(); } };
$('hrs').oninput = syncChips; syncChips();
function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
$('desc').addEventListener('input', e => autosize(e.target));
$('desc').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('date').onchange = refreshForm;
$('sub').onchange = () => {     // reuse the last entry for this sub context
  const v = $('sub').value.trim(); if (!v || $('desc').value.trim()) return;
  const t = [...S.tasks].reverse().find(x => x.sub === v && !x.def); if (!t) return;
  $('desc').value = t.desc; $('hrs').value = t.hrs; syncChips(); autosize($('desc'));
};
function refreshForm() {
  const subs = [], seen = new Set();
  for (let i = S.tasks.length - 1; i >= 0 && subs.length < 40; i--) { const s = S.tasks[i].sub; if (s && !S.tasks[i].def && !seen.has(s)) { seen.add(s); subs.push(s); } }
  $('subList').innerHTML = subs.map(s => `<option value="${esc(s)}">`).join('');
  const d = $('date').value || TODAY;
  $('hint').textContent = `${d === TODAY ? 'Today' : T.fmtDate(d)} · ${T.DAYN[T.dow(d)]} · ${T.sprintFor(d)} (auto)`;
}
$('form').onsubmit = e => {
  e.preventDefault();
  const date = $('date').value || TODAY, desc = $('desc').value.trim(); if (!desc) return;
  ensureDefaults(date);
  S.tasks.push({ id: uid(), date, ctx: T.sprintFor(date), sub: $('sub').value.trim(), desc, hrs: parseFloat($('hrs').value) || 0 });
  save(); $('sub').value = ''; $('desc').value = ''; autosize($('desc'));
  openDays.add(date); $('month').value = date.slice(0, 7);
  render(); $('desc').focus(); toast('Task added', 'ok');
};

// ---------- history ----------
const openDays = new Set([TODAY]);
let showAll = false;
const sum = list => T.round2(list.reduce((a, t) => a + (+t.hrs || 0), 0));
function render() {
  const ym = $('month').value || TODAY.slice(0, 7);
  const set = new Set(S.tasks.filter(t => t.date.startsWith(ym)).map(t => t.date));
  Object.keys(S.days).forEach(d => { if (d.startsWith(ym)) set.add(d); });
  if (TODAY.startsWith(ym)) set.add(TODAY);
  const dates = [...set].sort().reverse();       // newest first here; Excel is oldest first
  const LIMIT = 7, shown = showAll ? dates : dates.slice(0, LIMIT);
  $('days').innerHTML = shown.length ? shown.map(dayHtml).join('') : '<div class="card empty">No tasks this month.</div>';
  $('older').hidden = showAll || dates.length <= LIMIT;
  $('older').textContent = `Show ${dates.length - LIMIT} older day(s)`;
  document.querySelectorAll('#days textarea').forEach(autosize);
  refreshForm(); renderDefs(); updateTotals();
}
$('month').onchange = () => { showAll = false; render(); };
$('older').onclick = () => { showAll = true; render(); };

function dayHtml(d) {
  const list = S.tasks.filter(t => t.date === d), mark = S.days[d] || '';
  const w = T.dow(d), open = openDays.has(d), sel = v => (mark === v ? ' selected' : '');
  return `<section class="day ${d === TODAY ? 'today' : ''} ${mark || (w === 0 || w === 6 ? 'wk' : '')}" data-date="${d}">
    <div class="dayhead"><span class="caret">${open ? '▾' : '▸'}</span>
      <b>${T.DAYN[w]} ${T.fmtDate(d)}</b>
      ${d === TODAY ? '<span class="badge now">Today</span>' : ''}<span class="badge">${T.sprintFor(d)}</span>
      ${open ? '' : `<span class="badge">${list.length} task${list.length === 1 ? '' : 's'}</span>`}
      <span class="hrs" data-total="${d}"></span>
      <select class="mark" aria-label="Day status"><option value="">Working</option><option value="leave"${sel('leave')}>Leave</option><option value="off"${sel('off')}>Off / Holiday</option></select>
    </div>
    ${open ? (list.map(rowHtml).join('') || '<div class="empty">No tasks yet</div>') : ''}
  </section>`;
}
function rowHtml(t) {
  const d = t.def ? S.defaults.find(x => x.id === t.defId) : null;
  return `<div class="trow ${t.def ? 'def' : ''}" data-id="${t.id}">
    <span class="grip" title="Drag to move">⠿</span>
    <textarea data-f="desc" rows="1" aria-label="Description">${esc(t.desc)}</textarea>
    <div class="r2">
      <input data-f="sub" value="${esc(t.sub)}" placeholder="Sub context" aria-label="Sub context">
      <input data-f="hrs" type="number" inputmode="decimal" step="0.25" min="0" value="${t.hrs}" aria-label="Hours">
      <button class="ico" data-act="up" title="Move up">▲</button><button class="ico" data-act="down" title="Move down">▼</button>
      <button class="ico" data-act="again" title="Copy to today">⧉</button><button class="ico del" data-act="del" title="Delete">✕</button>
    </div>
    ${t.def ? `<span class="tag">🔁 daily default · ${d && d.chat ? 'sent to Chat' : 'not sent to Chat'}</span>` : ''}
  </div>`;
}
function updateTotals() {
  document.querySelectorAll('[data-total]').forEach(el => { el.textContent = sum(S.tasks.filter(t => t.date === el.dataset.total)) + ' h'; });
  const ym = $('month').value || TODAY.slice(0, 7);
  $('mtotal').textContent = sum(S.tasks.filter(t => t.date.startsWith(ym))) + ' h';
  const n = S.tasks.filter(t => t.date === TODAY && t.desc.trim() && sentFlag(t)).length;
  $('send').textContent = `📤 Send today to Chat (${n})`;
}
const days = $('days');
days.addEventListener('input', e => {
  const row = e.target.closest('.trow'), f = e.target.dataset.f; if (!row || !f) return;
  const t = S.tasks.find(x => x.id === row.dataset.id); if (!t) return;
  t[f] = f === 'hrs' ? (parseFloat(e.target.value) || 0) : e.target.value;
  if (f === 'desc') autosize(e.target);
  save(); updateTotals();
});
days.addEventListener('change', e => { if (e.target.classList.contains('mark')) setMark(e.target.closest('.day').dataset.date, e.target.value); });
days.addEventListener('click', e => {
  const head = e.target.closest('.dayhead');
  if (head && !e.target.closest('select')) {
    const d = head.parentNode.dataset.date; openDays.has(d) ? openDays.delete(d) : openDays.add(d); return render();
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.trow').dataset.id, i = S.tasks.findIndex(x => x.id === id), t = S.tasks[i], act = b.dataset.act;
  if (act === 'del') { S.tasks.splice(i, 1); save(); render(); toast('Task deleted', '', () => { S.tasks.splice(i, 0, t); save(); render(); }); }
  if (act === 'again') {
    ensureDefaults(TODAY);
    S.tasks.push({ ...t, id: uid(), date: TODAY, ctx: T.sprintFor(TODAY), def: false, defId: undefined });
    save(); openDays.add(TODAY); $('month').value = TODAY.slice(0, 7); render(); toast('Copied to today', 'ok');
  }
  if (act === 'up' || act === 'down') {       // swap with the neighbour of the same day
    const dir = act === 'up' ? -1 : 1; let j = i + dir;
    while (S.tasks[j] && S.tasks[j].date !== t.date) j += dir;
    if (!S.tasks[j]) return;
    [S.tasks[i], S.tasks[j]] = [S.tasks[j], S.tasks[i]]; save(); render();
  }
});
function setMark(d, v) {
  S.mat = S.mat.filter(x => x !== d);
  if (v) { S.days[d] = v; S.tasks = S.tasks.filter(t => !(t.date === d && t.def)); }
  else { delete S.days[d]; ensureDefaults(d); }
  save(); render();
}

// ---------- drag to move (pointer events: touch + mouse) ----------
let drag = null;
days.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  drag = g.closest('.trow'); drag.classList.add('moving'); g.setPointerCapture(e.pointerId); e.preventDefault();
});
days.addEventListener('pointermove', e => {
  if (!drag) return;
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 150) window.scrollBy(0, 14);   // edge auto-scroll
  const el = document.elementFromPoint(e.clientX, e.clientY), r = el && el.closest('.trow');
  if (!r || r === drag || r.closest('.day') !== drag.closest('.day')) return;
  const after = e.clientY > r.getBoundingClientRect().top + r.offsetHeight / 2;
  r.parentNode.insertBefore(drag, after ? r.nextSibling : r);
});
function endDrag() {
  if (!drag) return;
  const day = drag.closest('.day'), date = day.dataset.date, ids = [...day.querySelectorAll('.trow')].map(r => r.dataset.id);
  drag.classList.remove('moving'); drag = null;
  const idx = []; S.tasks.forEach((t, i) => { if (t.date === date) idx.push(i); });
  const map = new Map(S.tasks.filter(t => t.date === date).map(t => [t.id, t]));
  ids.forEach((id, k) => { S.tasks[idx[k]] = map.get(id); });
  save();
}
days.addEventListener('pointerup', endDrag); days.addEventListener('pointercancel', endDrag);

// ---------- daily defaults (configurable) ----------
function syncToday(d) {         // keep today's list in step when a default is added / toggled
  const mine = S.tasks.find(t => t.date === TODAY && t.defId === d.id);
  const eligible = S.mat.includes(TODAY) && isWorkday(TODAY) && d.on !== false;
  if (eligible && !mine) S.tasks.push(defTask(d, TODAY));
  if (!eligible && mine) S.tasks = S.tasks.filter(t => t !== mine);
}
function renderDefs() {
  $('defs').innerHTML = S.defaults.map(d => `<div class="drow" data-id="${d.id}">
    <div><b>${esc(d.desc)}</b><br><small class="m">${d.sub ? esc(d.sub) + ' · ' : ''}${d.hrs} h</small></div>
    <button class="ico del" type="button" style="background:transparent;color:var(--danger)" title="Delete">✕</button>
    <div class="opts">
      <label class="chk"><input type="checkbox" data-k="on" ${d.on !== false ? 'checked' : ''}> Add every weekday</label>
      <label class="chk"><input type="checkbox" data-k="chat" ${d.chat ? 'checked' : ''}> Send to Chat</label>
    </div></div>`).join('') || '<small class="m">None yet.</small>';
}
$('defs').addEventListener('change', e => {
  const k = e.target.dataset.k, row = e.target.closest('.drow'); if (!k || !row) return;
  const d = S.defaults.find(x => x.id === row.dataset.id); d[k] = e.target.checked;
  syncToday(d); save(); render();
});
$('defs').addEventListener('click', e => {
  const row = e.target.closest('.drow'); if (!row || !e.target.closest('button')) return;
  S.defaults = S.defaults.filter(d => d.id !== row.dataset.id);
  S.tasks = S.tasks.filter(t => !(t.date === TODAY && t.defId === row.dataset.id));
  save(); render();
});
$('dAdd').onclick = () => {
  const desc = $('dDesc').value.trim(); if (!desc) return toast('Enter a description', 'err');
  const d = { id: uid(), desc, sub: $('dSub').value.trim(), hrs: parseFloat($('dHrs').value) || 0, on: true, chat: $('dChat').checked };
  S.defaults.push(d); syncToday(d); save();
  $('dDesc').value = ''; $('dSub').value = ''; $('dChat').checked = false; render(); toast('Default added', 'ok');
};

// ---------- send to Chat (descriptions only) ----------
$('send').onclick = async () => {
  if (!setupOk()) { $('setBox').open = true; return toast('Complete Settings first', 'err'); }
  const list = S.tasks.filter(t => t.date === TODAY && t.desc.trim() && sentFlag(t));
  if (!list.length) return toast('No tasks to send for today', 'err');
  if (S.lastSent === TODAY && !confirm('Today was already sent. Send again?')) return;
  const text = `*${S.name}* — ${T.fmtDate(TODAY)}\n` + list.map(t => '• ' + t.desc.trim()).join('\n');
  $('send').disabled = true;
  try {
    // text/plain keeps this a simple CORS request (no preflight); Chat still parses the JSON.
    await fetch(S.hook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ text }) });
    S.lastSent = TODAY; save(); toast(`Sent ${list.length} task(s) to Chat`, 'ok');
  } catch (err) { toast('Network error: ' + err.message, 'err'); }
  $('send').disabled = false;
};

// ---------- Excel download ----------
$('dl').onclick = async () => {
  if (!window.ExcelJS) return toast('Excel library not loaded (offline?)', 'err');
  if (!setupOk()) { $('setBox').open = true; return toast('Complete Settings first', 'err'); }
  const ym = $('month').value || TODAY.slice(0, 7);
  const ordered = S.tasks.map((t, i) => [t, i]).sort((a, b) => a[0].date.localeCompare(b[0].date) || a[1] - b[1]).map(x => x[0]);
  const wb = T.buildWorkbook(ExcelJS, { tasks: ordered, days: S.days, name: S.name, empId: S.empId, ym });
  const buf = await wb.xlsx.writeBuffer(), [y, m] = ym.split('-'), a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `Timesheet_${S.name.replace(/\s+/g, '_')}_${T.MON[+m - 1]}-${y}.xlsx`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Excel downloaded', 'ok');
};

render();
</script>
</body>
</html>
